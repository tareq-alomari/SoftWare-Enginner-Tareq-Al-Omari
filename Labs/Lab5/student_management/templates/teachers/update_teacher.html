<!-- templates/teachers/update_teacher.html -->
{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">تعديل بيانات المعلم</h2>

<form method="POST">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="f_name">الاسم الأول</label>
                <input type="text" class="form-control" id="f_name" name="f_name" value="{{ teacher.f_name }}" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="l_name">الاسم الأخير</label>
                <input type="text" class="form-control" id="l_name" name="l_name" value="{{ teacher.l_name }}" required>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-4">
            <div class="form-group mb-3">
                <label for="age">العمر</label>
                <input type="number" class="form-control" id="age" name="age" value="{{ teacher.age }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group mb-3">
                <label for="specialty">التخصص</label>
                <input type="text" class="form-control" id="specialty" name="specialty" value="{{ teacher.specialty }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group mb-3">
                <label for="years_of_experience">سنوات الخبرة</label>
                <input type="number" class="form-control" id="years_of_experience" name="years_of_experience" value="{{ teacher.years_of_experience }}" required>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="salary">الراتب</label>
                <input type="number" step="0.01" class="form-control" id="salary" name="salary" value="{{ teacher.salary }}" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label for="is_active">حالة المعلم</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if teacher.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">نشط</label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="form-group mb-3">
        <label for="notes">ملاحظات</label>
        <textarea class="form-control" id="notes" name="notes" rows="3">{{ teacher.notes }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">تحديث</button>
    <a href="{% url 'teacher:teachers' %}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
