<!-- templates/courses/course_confirm_delete.html -->
{% extends 'base.html' %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h4>تأكيد الحذف</h4>
    </div>
    <div class="card-body">
        <p class="card-text">هل أنت متأكد من أنك تريد حذف المادة الدراسية "{{ course.name }} ({{ course.code }})"؟</p>
        <p class="card-text text-danger"><strong>تحذير:</strong> لا يمكن التراجع عن هذه العملية.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">نعم، احذف</button>
            <a href="{% url 'course:course_list' %}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</div>
{% endblock %}
